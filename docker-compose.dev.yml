# =============================================================
# Docker Compose — Development
# Full platform stack: backend, frontend, worker, beat,
# postgres, redis, pgadmin, mailhog (dev email)
# =============================================================

version: "3.9"

x-backend-common: &backend-common
  build:
    context: ./backend
    target: development
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - ./backend:/app
    - backend_uploads:/app/uploads
  networks:
    - platform_net

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: whatsapp_platform
      POSTGRES_USER: whatsapp_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp_user -d whatsapp_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform_net

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-dev_redis_pass}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform_net

  # ── Backend (Flask API) ────────────────────────────────────
  backend:
    <<: *backend-common
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: wsgi:app
      FLASK_ENV: development

  # ── Celery Worker ──────────────────────────────────────────
  worker:
    <<: *backend-common
    command: >
      celery -A app.tasks.celery_app:celery_app worker
      --loglevel=info
      -Q default,ai,workflows,critical
      --concurrency=4
    environment:
      FLASK_ENV: development

  # ── Celery Beat (Scheduler) ────────────────────────────────
  beat:
    <<: *backend-common
    command: >
      celery -A app.tasks.celery_app:celery_app beat
      --loglevel=info
      --scheduler celery.beat:PersistentScheduler
    environment:
      FLASK_ENV: development

  # ── Celery Flower (Monitoring UI) ─────────────────────────
  flower:
    <<: *backend-common
    command: >
      celery -A app.tasks.celery_app:celery_app flower
      --port=5555
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    ports:
      - "5555:5555"

  # ── Frontend (Vite/React) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
    networks:
      - platform_net

  # ── Nginx (Reverse Proxy) ──────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - platform_net

  # ── PgAdmin (Dev DB GUI) ───────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dev.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    networks:
      - platform_net
    profiles:
      - devtools

  # ── MailHog (Dev Email) ────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    networks:
      - platform_net
    profiles:
      - devtools

volumes:
  postgres_data:
  redis_data:
  backend_uploads:

networks:
  platform_net:
    driver: bridge
